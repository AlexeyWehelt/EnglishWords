<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренажёр английских слов</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one column. Title + progress lamp, a small menu, then one view (login / training / progress). */
:root{
  --bg:#edf0f3; --surface:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d3dae1;
  --accent:#1d5a9e; --accent-soft:#e1ebf7;
  --ok:#23824a; --ok-soft:#e2f3e8; --bad:#c23b33; --bad-soft:#fbe7e5; --warn:#b97716;
  --lamp-off:#c3cbd3;
  --f-word:"Literata",Georgia,serif;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11161c; --surface:#1a2129; --ink:#e5eaf0; --muted:#94a2b1; --line:#2b3540;
  --accent:#71a8e6; --accent-soft:#1c2c40; --ok:#58c07f; --ok-soft:#173023; --bad:#e8675e; --bad-soft:#3a1c1a; --warn:#e0a54c;
  --lamp-off:#3a4552; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:600px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-word);font-weight:700;font-size:1.35rem;margin:0}
h2{font-family:var(--f-word);font-weight:700;font-size:1.15rem;margin:0}
.lamp{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px}
.bulb{width:22px;height:22px;border-radius:50%;background:var(--lamp-off);flex:none;box-shadow:inset 0 -3px 5px rgba(0,0,0,.18)}
.lamp[data-state="amber"] .bulb{background:var(--warn)}
.lamp[data-state="green"] .bulb{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft),0 0 16px var(--ok)}
.lamp-txt{display:flex;flex-direction:column;line-height:1.15}
.lamp-txt b{font-size:.85rem;font-weight:600}
.lamp-txt span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.menu{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.menu .tab{border:0;background:none;color:var(--muted);font:500 .9rem var(--f-ui);padding:7px 12px;border-radius:7px;cursor:pointer}
.menu .tab[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.menu .who{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;font-size:.88rem}
.menu .who b{font-weight:600}
.linkish{border:0;background:none;color:var(--accent);font:inherit;font-size:.85rem;cursor:pointer;padding:2px;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 18px 24px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;min-height:380px;justify-content:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;gap:10px;align-items:center;font-size:.75rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.word{font-family:var(--f-word);font-weight:700;font-size:clamp(2.2rem,10vw,3.4rem);line-height:1.1;overflow-wrap:anywhere;margin:0;border:0;background:none;color:var(--ink);cursor:pointer;padding:0 4px}
.field{width:100%;max-width:420px;display:flex;gap:8px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
input:focus{outline:2px solid var(--accent);border-color:transparent}
.field input{flex:1;font-size:1.1rem;text-align:center}
.mic{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font:500 .85rem var(--f-ui);cursor:pointer;padding:0}
.mic .ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent);background:var(--surface);position:relative}
.mic:hover .ring{background:var(--accent-soft)}
.mic:focus-visible .ring{outline:3px solid var(--accent);outline-offset:3px}
.mic.listening .ring{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.mic.listening .ring::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--bad);opacity:.6}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:10px;padding:12px 20px;font:600 1rem var(--f-ui);cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.tab:focus-visible,.linkish:focus-visible,.word:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.big{padding:14px 40px;font-size:1.1rem}
.status{min-height:1.4em;font-size:.88rem;color:var(--muted);margin:0;max-width:42ch}
.status.err{color:var(--bad)}
.verdict{width:100%;max-width:420px;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.verdict b{font-size:1.15rem}
.verdict.ok b{color:var(--ok)} .verdict.bad b{color:var(--bad)}
.meanings{font-size:1.1rem;font-weight:500}
.your{font-size:.85rem;color:var(--muted)}
.example{margin-top:6px;border:0;border-top:1px dashed var(--bad);background:none;color:var(--ink);text-align:center;align-items:center;padding:10px 0 0;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit}
.example:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ex-en{font-family:var(--f-word);font-size:1.15rem;font-weight:500}
.ex-en::before{content:"▶ ";font-size:.75em;color:var(--bad);vertical-align:.1em}
.ex-ru{font-size:.92rem;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.intro{color:var(--muted);max-width:38ch;margin:0}
/* login */
.login{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;text-align:left}
.login label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.login input{font-size:1.05rem;text-transform:none;letter-spacing:normal}
.login #lcode{letter-spacing:.35em;max-width:9rem}
/* progress */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sum div{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.sum b{font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.1}
.sum span{font-size:.75rem;color:var(--muted)}
.sum .g b{color:var(--ok)} .sum .y b{color:var(--warn)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 .82rem var(--f-ui);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .w{min-width:0}
.item .w b{font-family:var(--f-word)}
.item .w span{display:block;color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.item .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.actions{display:flex;align-items:center;gap:22px;justify-content:center;flex-wrap:wrap}
.btn.plain{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.plain:hover{border-color:var(--muted)}
.meter{display:inline-block;position:relative;width:64px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle}
.meter::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.meter i{position:absolute;top:0;bottom:0;border-radius:4px}
.meter i.pos{background:var(--ok)} .meter i.neg{background:var(--bad)}
.rnum{font-variant-numeric:tabular-nums;font-weight:600;min-width:2.6em;display:inline-block;text-align:right;color:var(--muted)}
.rnum.good{color:var(--ok)} .rnum.bad{color:var(--bad)}
.rating{display:inline-flex;align-items:center;gap:6px}
.delta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.sum .r b{color:var(--bad)}
.practice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--warn);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.88rem}
.practice b{color:var(--warn)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:150px;resize:vertical;width:100%}
textarea:focus{outline:2px solid var(--accent);border-color:transparent}
code{font-size:.85em;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.loadprev{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.preview{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:520px;overflow:auto}
.pv{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:start;padding:9px 10px;border-bottom:1px solid var(--line)}
.pv:last-child{border-bottom:0}
.pv>input[type=checkbox]{margin-top:10px;width:18px;height:18px}
.pv input[type=text]{width:100%;padding:7px 9px;font-size:.92rem;border-radius:8px}
.pv-en input{font-family:var(--f-word);font-weight:700}
.pv-en,.pv-ru{display:flex;flex-direction:column;gap:4px;min-width:0}
.pv-tags{display:flex;gap:4px;flex-wrap:wrap}
.pv-ex{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:.68rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.phrase{border-color:var(--accent);color:var(--accent)}
.tag.dup{border-color:var(--warn);color:var(--warn)}
@media (max-width:520px){.pv{grid-template-columns:auto minmax(0,1fr)}.pv-ru{grid-column:2}}
.dropped{font-size:.85rem;color:var(--muted)}
.dropped summary{cursor:pointer;color:var(--accent)}
.dropped p{margin:6px 0 0;overflow-wrap:anywhere}
.ru-edit{width:100%;margin-top:4px;padding:6px 8px;font-size:.88rem;border-radius:8px}
.ru-edit.saved{outline:2px solid var(--ok)} .ru-edit.err{outline:2px solid var(--bad)}
.del{border:0;background:none;color:var(--bad);font:inherit;font-size:.78rem;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--muted);text-align:center;padding:18px 0;margin:0}
@media (max-width:460px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}.menu .who{margin-left:0;width:100%;padding:4px 8px}}
@media (prefers-reduced-motion:no-preference){
  .mic.listening .ring::after{animation:pulse 1.2s ease-out infinite}
  @keyframes pulse{from{transform:scale(.9);opacity:.7}to{transform:scale(1.25);opacity:0}}
  .verdict{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Тренажёр английских слов</h1>
    <div class="lamp" id="lamp" data-state="off" title="Индикатор успеваемости" hidden>
      <div class="bulb"></div>
      <div class="lamp-txt"><b id="lampTitle">Успеваемость</b><span id="lampSub">—</span></div>
    </div>
  </header>
  <div class="bar" id="bar" aria-hidden="true" hidden><i id="barFill"></i></div>
  <nav class="menu" id="menu" hidden>
    <button class="tab" id="tab-train" type="button" aria-current="true">Тренировка</button>
    <button class="tab" id="tab-stats" type="button" aria-current="false">Усваиваемость</button>
    <button class="tab" id="tab-lessons" type="button" aria-current="false">Занятия</button>
    <button class="tab" id="tab-load" type="button" aria-current="false">Загрузка</button>
    <span class="who"><b id="whoName"></b><button class="linkish" id="logout" type="button">Выйти</button></span>
  </nav>
  <div class="practice" id="practiceBar" role="status" hidden><span><b>Режим без статистики.</b> Ответы не меняют рейтинг слов и не записываются в занятия. Чтобы выйти, нажмите N дважды.</span><button class="linkish" id="practiceOff" type="button">Выйти из режима</button></div>

  <main class="card" id="view-login">
    <h2>Вход</h2>
    <form class="login" id="loginForm" novalidate>
      <label for="lname">Имя<input id="lname" autocomplete="username" maxlength="16"></label>
      <label for="lcode">Пароль из 4 цифр<input id="lcode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••"></label>
      <button class="btn" id="loginBtn" type="submit">Войти</button>
      <p class="status" id="loginMsg" role="alert"></p>
    </form>
    <p class="intro">Если такого имени ещё нет, будет создан новый аккаунт с этим паролем.</p>
    <p class="intro" style="font-size:.75rem">версия 10</p>
  </main>
  <main class="card" id="view-train" aria-live="polite" hidden></main>
  <main class="panel" id="view-stats" hidden></main>
  <main class="panel" id="view-lessons" hidden></main>
  <main class="panel" id="view-load" hidden></main>
</div>

<script>
const BASE = `about|о, об; около, примерно; вокруг

/* A simple sentence for each base word: shown and spoken after a wrong answer */
const EXAMPLES_SRC = `about|We talk about music.|Мы говорим о музыке.
after|I play after school.|Я играю после школы.

of|A cup of tea, please.|Чашку чая, пожалуйста.

const EXAMPLES={};
EXAMPLES_SRC.split('\n').forEach(l=>{const [w,en,ru]=l.split('|');if(w&&en&&ru)EXAMPLES[w.trim()]={en:en.trim(),ru:ru.trim()}});
const SEED_ACCOUNTS = ['юра'];        // these new accounts start with the base word set; others start empty
/* Rating: a new word is 0 (neutral). A right answer adds up to +1 (less the longer the pause before answering),
   a wrong answer or "Не знаю" takes 1 away. The scale runs from -5 to +5; from +3 a word counts as learned. */
const RMIN = -5, RMAX = 5, LEARNED = 3;
const FAST = 3, SLOW = 15;            // seconds: answered within FAST -> full +1; after SLOW -> only +0.1
const PENALTY = 1;
const SESSION_GAP = 30*60*1000;       // a pause longer than this starts a new lesson in "Занятия"
const SPEAK_DELAY = 500;
/* A word whose rating goes above +5 moves to the archive: it is no longer shown and is left out of the statistics. */
const active=()=>words.filter(w=>!w.a), archived=()=>words.filter(w=>w.a);              // ms between showing the word and saying it

/* ---------- Accounts: same scheme as the maze game (name + 4 digits, Firebase) ---------- */
const keyOf = name => name.trim().toLowerCase().replace(/[.#$\[\]\/\s]+/g,'_').slice(0,16);
const wordKey = en => en.toLowerCase().trim().replace(/[.#$\[\]\/\s]+/g,'_');
async function hashCode(key, code){
  const txt=key+':'+code;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return Array.from(new Uint8Array(b)).map(v=>v.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(let i=0;i<txt.length;i++)h=(h*33^txt.charCodeAt(i))>>>0;return 'x'+h.toString(16)}
}
function baseWords(){
  const out={};
  BASE.split('\n').forEach(l=>{const [en,ru]=l.split('|');if(!en||!ru)return;const e=en.trim().toLowerCase();
    out[wordKey(e)]={en:e,ru:ru.split(';').map(s=>s.trim()).filter(Boolean),r:0,seen:0,ok:0,last:0}});
  return out;
}
// Stored next to the maze players (current database rules allow it); the w_ prefix keeps trainer accounts separate.
const ROOT='users/w_';
function makeFirebase(cfg){
  const fb=window.firebase; fb.initializeApp(cfg); const db=fb.database(); let off=null;
  return {
    async login(key,name,h){
      const res=await db.ref(ROOT+key).transaction(cur=>cur===null?{name,h,c:Date.now(),words:SEED_ACCOUNTS.includes(key)?baseWords():null}:undefined);
      const u=res.snapshot.val(); if(!u||u.h!==h) return {ok:false};
      return {ok:true,name:u.name||name};
    },
    watch(key,fn){off&&off();const r=db.ref(ROOT+key);const cb=s=>fn(s.val()||{});r.on('value',cb);off=()=>r.off('value',cb)},
    unwatch(){off&&off();off=null},
    save(key,k,w){return db.ref(ROOT+key+'/words/'+k).set(w)},
    saveSession(key,id,s){return db.ref(ROOT+key+'/sessions/'+id).set(s)},
    addWords(key,map){return db.ref(ROOT+key+'/words').update(map)},
    removeWord(key,k){return db.ref(ROOT+key+'/words/'+k).remove()}
  };
}
/* same-browser backend for testing: add #local to the address */
function makeLocal(){
  const LS='en-trainer-users', get=()=>{try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}, put=u=>{try{localStorage.setItem(LS,JSON.stringify(u))}catch(e){}};
  let fn=null,me=null;
  const emit=()=>{if(fn&&me)fn(get()[me]||{})};
  addEventListener('storage',e=>{if(e.key===LS)emit()});
  const setAt=(key,sect,id,v)=>{const u=get();if(u[key]){(u[key][sect]=u[key][sect]||{})[id]=v;put(u);setTimeout(emit,0)}};
  return {
    async login(key,name,h){const u=get();if(!u[key]){u[key]={name,h,c:Date.now(),words:SEED_ACCOUNTS.includes(key)?baseWords():{}};put(u)}
      return u[key].h===h?{ok:true,name:u[key].name}:{ok:false}},
    watch(key,f){me=key;fn=f;emit()},
    unwatch(){fn=null;me=null},
    async save(key,k,w){setAt(key,'words',k,w)},
    async saveSession(key,id,s){setAt(key,'sessions',id,s)},
    async addWords(key,map){for(const k in map)setAt(key,'words',k,map[k])},
    async removeWord(key,k){const u=get();if(u[key]&&u[key].words){delete u[key].words[k];put(u);setTimeout(emit,0)}}
  };
}
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const backendReady=(async()=>{
  try{
    if(/local/.test(location.hash)) return makeLocal();
    if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.databaseURL){
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
      return makeFirebase(window.FIREBASE_CONFIG);
    }
  }catch(e){}
  return null;
})();

/* ---------- Rating helpers ---------- */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const round2=v=>Math.round(v*100)/100;
function speedFactor(sec){ if(sec<=FAST) return 1; if(sec>=SLOW) return .1; return 1-.9*(sec-FAST)/(SLOW-FAST); }
const fmtR=r=>(r>0?'+':r<0?'−':'')+Math.abs(r).toFixed(1).replace('.',',');
const fmtSec=s=>s.toFixed(1).replace('.',',')+' с';
function meter(r){
  const w=Math.abs(r)/RMAX*50;
  return `<span class="rating"><span class="meter" title="Рейтинг ${fmtR(r)} (от −5 до +5)"><i class="${r>=0?'pos':'neg'}" style="${r>=0?'left:50%':'right:50%'};width:${w}%"></i></span><span class="rnum ${r>=LEARNED?'good':r<0?'bad':''}">${fmtR(r)}</span></span>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Progress lamp ---------- */
function progress(){
  const act=active(), n=act.length, learned=act.filter(w=>w.r>=LEARNED).length, pct=n?Math.round(learned/n*100):(words.length?100:0);
  $('lamp').dataset.state=!words.length?'off':learned===n?'green':learned>0?'amber':'off';
  const arch=words.length-n;
  $('lampTitle').textContent=words.length&&learned===n?'Все слова выучены':'Успеваемость '+pct+'%';
  $('lampSub').textContent=!words.length?'слов пока нет':(n?`${learned} из ${n} слов усвоено`:'все слова в архиве')+(arch&&n?` · в архиве ${arch}`:'');
  $('barFill').style.width=pct+'%';
}

/* ---------- Усваиваемость ---------- */
let filter='all';
function renderStats(){
  const act=active(), n=act.length;
  const groups={all:act,learned:act.filter(w=>w.r>=LEARNED),mid:act.filter(w=>w.seen&&w.r>=0&&w.r<LEARNED),
    hard:act.filter(w=>w.r<0),fresh:act.filter(w=>!w.seen),archive:archived()};
  const seen=act.reduce((s,w)=>s+w.seen,0), ok=act.reduce((s,w)=>s+w.ok,0);
  const timed=act.filter(w=>w.t>0), avgT=timed.length?timed.reduce((s,w)=>s+w.t,0)/timed.length:0;
  const list=filter==='archive'?groups.archive.slice().sort((a,b)=>b.a-a.a)
    :groups[filter].slice().sort((a,b)=>a.r-b.r||b.seen-a.seen||a.en.localeCompare(b.en));
  const ruCell=w=>editMode
    ?`<input type="text" class="ru-edit" id="ed-${esc(w.k)}" data-k="${esc(w.k)}" value="${esc(w.ru.join('; '))}" aria-label="Значения слова ${esc(w.en)}"><button class="del" type="button" data-del="${esc(w.k)}" aria-label="Удалить ${esc(w.en)}">Удалить</button>`
    :`<span>${esc(w.ru.join('; '))}</span>`;
  const row=w=>filter==='archive'
    ?`<div class="item"><div class="w"><b lang="en">${esc(w.en)}</b>${ruCell(w)}</div>
      <div class="r"><span>в архиве с ${DF.format(w.a)}</span><button class="linkish" type="button" data-back="${esc(w.k)}">Вернуть в тренировку</button></div></div>`
    :`<div class="item"><div class="w"><b lang="en">${esc(w.en)}</b>${ruCell(w)}</div>
      <div class="r">${meter(w.r)}<span>${w.seen?`верно ${w.ok} из ${w.seen}${w.t?' · '+fmtSec(w.t):''}`:'не встречалось'}</span></div></div>`;
  $('view-stats').innerHTML=`<h2>Усваиваемость слов</h2>
    ${editMode?`<div class="practice" role="status"><span><b>Режим редактирования.</b> Исправьте значения слова (разделяйте точкой с запятой) и нажмите Enter. Чтобы выйти, нажмите R дважды.</span><button class="linkish" id="editOff" type="button">Выйти из режима</button></div>`:''}
    <div class="sum"><div class="g"><b>${groups.learned.length}</b><span>усвоено (от +3)</span></div><div class="y"><b>${groups.mid.length}</b><span>в процессе</span></div>
      <div class="r"><b>${groups.hard.length}</b><span>трудные (ниже 0)</span></div><div><b>${groups.fresh.length}</b><span>ещё не было</span></div></div>
    <p class="hint">Верных ответов: ${seen?Math.round(ok/seen*100)+'%':'—'}${avgT?` · среднее время верного ответа ${fmtSec(avgT)}`:''}${groups.archive.length?`<br>Слов в архиве: ${groups.archive.length}. Они набрали больше +5 и в тренировке и статистике больше не участвуют.`:''}</p>
    <div class="filters">${[['all','Все',n],['hard','Трудные',groups.hard.length],['mid','В процессе',groups.mid.length],['learned','Усвоено',groups.learned.length],['fresh','Ещё не было',groups.fresh.length],['archive','Архив',groups.archive.length]]
      .map(([k,t,c])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${filter===k}">${t} · ${c}</button>`).join('')}</div>
    <div class="list">${list.length?list.map(row).join(''):
      `<p class="empty">${filter==='archive'?'В архиве пока нет слов.':n?'В этой группе слов нет.':words.length?'Все слова в архиве.':'В словаре пока нет слов.'}</p>`}</div>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderStats()});
  if(editMode) bindEdit();
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{
    const w=words.find(x=>x.k===b.dataset.back); if(!w) return;
    w.a=0; w.r=LEARNED; const {k,...data}=w; B.save(me,k,data).catch(()=>{}); progress(); renderStats();
  });
}

let editMode=false, lastR=0;
document.addEventListener('keydown',e=>{

  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;

function bindEdit(){
  const off=$('editOff'); if(off) off.onclick=()=>{editMode=false;renderStats()};
  document.querySelectorAll('.ru-edit').forEach(inp=>{
    const commit=()=>{
      const w=words.find(x=>x.k===inp.dataset.k); if(!w) return;
      const ru=inp.value.split(';').map(x=>x.trim()).filter(Boolean);
      if(!ru.length){inp.value=w.ru.join('; ');return}
      if(ru.join('; ')===w.ru.join('; ')) return;
      w.ru=ru; const {k,...data}=w;
      B.save(me,k,data).then(()=>{inp.classList.add('saved');setTimeout(()=>inp.classList.remove('saved'),1200)}).catch(()=>inp.classList.add('err'));
    };
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit();inp.blur()} else if(e.key==='Escape'){const w=words.find(x=>x.k===inp.dataset.k);if(w)inp.value=w.ru.join('; ');inp.blur()}};
    inp.onblur=commit;
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Точно удалить?';setTimeout(()=>{if(b.isConnected){b.dataset.armed='';b.textContent='Удалить'}},3000);return}

function lemmaCands(t){
  const c=[];
  if(/ies$/.test(t)&&t.length>4) c.push(t.slice(0,-3)+'y');
  if(/ied$/.test(t)&&t.length>4) c.push(t.slice(0,-3)+'y');
  if(/es$/.test(t)) c.push(t.slice(0,-2));
  if(/s$/.test(t)) c.push(t.slice(0,-1));
  if(/ed$/.test(t)){c.push(t.slice(0,-2),t.slice(0,-1));if(t.length>4&&t[t.length-3]===t[t.length-4])c.push(t.slice(0,-3))}
  if(/ing$/.test(t)){c.push(t.slice(0,-3),t.slice(0,-3)+'e');if(t.length>5&&t[t.length-4]===t[t.length-5])c.push(t.slice(0,-4))}
  if(/er$/.test(t)){c.push(t.slice(0,-2),t.slice(0,-1));if(t.length>4&&t[t.length-3]===t[t.length-4])c.push(t.slice(0,-3));if(/ier$/.test(t))c.push(t.slice(0,-3)+'y')}
  if(/est$/.test(t)){c.push(t.slice(0,-3),t.slice(0,-2));if(t.length>5&&t[t.length-4]===t[t.length-5])c.push(t.slice(0,-4));if(/iest$/.test(t))c.push(t.slice(0,-4)+'y')}

/* base form of a word from running text; null when it is not a common word */
function lemma(t){

  if(COMMON){ if(COMMON.has(t)) return t; for(const c of lemmaCands(t)) if(COMMON.has(c)) return c; return null; }
  if(BASE_DICT[t]||t.length<4) return t;
  if(/ies$/.test(t)&&t.length>4) return t.slice(0,-3)+'y';

  if(/[^s]s$/.test(t)) return t.slice(0,-1);

function parseInput(text){
  const items=[], prose=[], dropped=new Set();
  const add=(en,ru,how,ex)=>{en=en.toLowerCase().replace(/[^a-z' -]/g,' ').replace(/\s+/g,' ').trim().replace(/^'+|'+$/g,'');if(en)items.push({en,ru:ru||[],how,ex})};

    line=line.trim(); if(!/[A-Za-z]/.test(line)) continue;

    const pair=line.match(/^([A-Za-z][A-Za-z' ,.-]*?)\s*(?:\t|\s[—–-]\s|—|–|=|:)\s*(.*[А-Яа-яЁё].*)$/);

    const listy=/[,;]/.test(line)?splitTop(line).every(it=>it.replace(/\([^)]*\)/g,'').trim().split(/\s+/).length<=4):words.length<=3;
    if(listy&&!/[.!?]["»”']?$/.test(line)){
      for(const it of splitTop(line)){
        const m=it.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
        if(m&&CYR.test(m[2])){ add(m[1],meaningsOf(m[2]),'fixed'); continue; }
        const en=it.replace(/\([^)]*\)/g,'').toLowerCase().replace(/[^a-z' -]/g,' ').replace(/\s+/g,' ').trim(); if(!en) continue;
        if(!COMMON){ add(en,[],'list'); continue; }
        // without a translation, a list item must be a common word or a known expression; anything else goes through the text filter
        const ws=en.split(' ');
        if(PHRASES[en]) add(en,[],'list');
        else if(ws.length===1){ const l=lemma(ws[0]); if(l) add(l,[],'list'); else dropped.add(ws[0]); }
        else if(ws.length===2&&ws.every(w=>COMMON.has(w)||lemma(w))&&!ws.some(w=>w.length<2)) add(en,[],'list');
        else prose.push(it+'.');
      }
    } else prose.push(line);
  }

  const body=prose.join(' ');

    const fixedHere=[];
    const clean=body.replace(/([A-Za-z][A-Za-z']*)\s*\(([^)]*[А-Яа-яЁё][^)]*)\)/g,(all,w,ru)=>{fixedHere.push([w,ru]);return w});
    fixedHere.forEach(([w,ru])=>add(lemma(w.toLowerCase())||w.toLowerCase(),meaningsOf(ru),'fixed'));
    const sentences=clean.match(/[^.!?]+[.!?]*/g)||[clean];
    for(const sen of sentences){
      const raw=sen.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[]; const toks=raw.map(t=>t.toLowerCase());
      const ex=sen.trim().replace(/\s+/g,' ');
      for(let i=0;i<toks.length;){
        const hit=PHRASE_LIST.find(p=>p.every((w,k)=>toks[i+k]===w));
        if(hit){add(hit.join(' '),[],'text',ex);i+=hit.length;continue}
        let t=toks[i]; const orig=raw[i]; i++;
        if(t.includes("'")){ if(/'s$/.test(t)) t=t.slice(0,-2); else continue; }
        if(SKIPW.has(t)||(t.length<2&&t!=='i')) continue;
        const name=/^[A-Z]/.test(orig)&&i>1&&!/^I$/.test(orig);   // capitalised mid-sentence: probably a name
        const l=lemma(t); if(!l){dropped.add(t);continue}

    }
  }
  // merge duplicates: given / fixed meanings win, keep the first example
  const map=new Map();

    const k=wordKey(it.en), was=map.get(k);

    if((it.how==='given'||it.how==='fixed')&&!(was.how==='given'||was.how==='fixed')){was.ru=it.ru;was.how=it.how}
    if(was.how==='name'&&it.how!=='name') was.how=it.how;
    if(!was.ex&&it.ex) was.ex=it.ex;
  }
  const out=[...map.values()]; out.dropped=[...dropped].filter(t=>!map.has(wordKey(t))); return out;
}

/* online translation (no key needed); every result can be corrected by hand before adding */
async function translateWord(q){
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&dt=bd&q='+encodeURIComponent(q));
    if(r.ok){const d=await r.json();const out=[];
      const main=d&&d[0]?d[0].map(x=>x&&x[0]||'').join('').trim().toLowerCase():'';
      if(main&&CYR.test(main)) out.push(main);
      // dictionary meanings come with a frequency score: keep only the common ones of the first two parts of speech
      if(Array.isArray(d[1])) for(const pos of d[1].slice(0,2)){
        const ents=Array.isArray(pos[2])?pos[2]:(pos[1]||[]).map(t=>[t,null,null,1]);
        const top=ents.length?(ents[0][3]||0):0;
        for(const e of ents.slice(0,3)){
          const t=String(e[0]||'').toLowerCase(), sc=e[3]||0;
          if(t&&CYR.test(t)&&!out.includes(t)&&out.length<4&&(e===ents[0]||sc>=Math.max(.01,top*.15))) out.push(t);
        }
      }
      if(out.length) return out;}
  }catch(e){}
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|ru&q='+encodeURIComponent(q));
    if(r.ok){const d=await r.json();const t=d&&d.responseData&&d.responseData.translatedText;if(t&&CYR.test(t))return [t.trim()]}
  }catch(e){}
  return null;
}

}

const libs={};
function lib(name,src,global){return libs[name]||(libs[name]=loadScript(src).then(()=>window[global]))}
const getZip=()=>lib('zip','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','JSZip');

let ocrWorker=null;
function drawRotated(bmp,deg,maxSide){
  const k=Math.min(1,maxSide/Math.max(bmp.width,bmp.height)), w=Math.round(bmp.width*k), h=Math.round(bmp.height*k);
  const c=document.createElement('canvas'), side=deg%180!==0;
  c.width=side?h:w; c.height=side?w:h;
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.translate(c.width/2,c.height/2); g.rotate(deg*Math.PI/180); g.drawImage(bmp,-w/2,-h/2,w,h);
  return c;
}
/* text of the confidently read words only, line by line (shaky guesses are usually OCR garbage) */
function ocrText(data){
  if(data&&Array.isArray(data.lines)&&data.lines.length)
    return data.lines.map(l=>(l.words||[]).filter(w=>w.confidence>=55).map(w=>w.text).join(' ')).filter(Boolean).join('\n');
  return data&&data.text||'';
}
const goodWords=data=>(data&&data.words||[]).filter(w=>w.confidence>=70&&(w.text.match(/[A-Za-zА-Яа-яЁё]/g)||[]).length>=3).length;
async function ocr(blob,label){
  const T=await getTess();
  if(!ocrWorker){loadStatus('Загружаю распознавание текста (первый раз около 10–20 секунд)…');ocrWorker=await T.createWorker(['eng','rus'])}
  const bmp=await createImageBitmap(blob);
  // photos of a book are often taken sideways: try the four turns on a small copy and keep the one that reads best
  loadStatus(label+' — определяю, как повёрнута страница…');
  await ocrWorker.setParameters({tessedit_pageseg_mode:'11'});
  let best=0, bestScore=-1;
  for(const deg of [0,90,270,180]){
    const {data}=await ocrWorker.recognize(drawRotated(bmp,deg,1000));
    const sc=goodWords(data); if(sc>bestScore){bestScore=sc;best=deg}
  }
  const full=drawRotated(bmp,best,2000);
  loadStatus(label+' — читаю текст…');
  await ocrWorker.setParameters({tessedit_pageseg_mode:'3'});         // as a page: keeps lines like "apple — яблоко"
  const a=ocrText((await ocrWorker.recognize(full)).data);
  await ocrWorker.setParameters({tessedit_pageseg_mode:'11'});        // as scattered text: finds speech bubbles and captions
  const b=ocrText((await ocrWorker.recognize(full)).data);
  bmp.close&&bmp.close();
  return (a+'\n\n'+b).trim();
}
const IMG=/\.(jpe?g|png)$/i, TXT=/\.(txt|csv|text)$/i, XLS=/\.xlsx?$/i, ZIP=/\.zip$/i;
async function readXlsx(buf){
  const X=await getXlsx(); const wb=X.read(buf,{type:'array'}); const out=[];
  for(const n of wb.SheetNames) for(const r of X.utils.sheet_to_json(wb.Sheets[n],{header:1})){
    const en=String(r[0]??'').trim(), ru=String(r[1]??'').trim(); if(en) out.push(ru?en+' — '+ru:en);
  }
  return out.join('\n');
}
async function readFiles(files){
  const parts=[]; let nImg=0, done=0;
  const queue=[];
  for(const f of files){
    if(ZIP.test(f.name)){
      loadStatus('Открываю архив '+f.name+'…');
      const Z=await getZip(); const z=await Z.loadAsync(f);
      Object.values(z.files).filter(e=>!e.dir&&!/(^|\/)(__MACOSX|\.)/.test(e.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))
        .forEach(e=>queue.push({name:e.name,get:t=>e.async(t)}));
    } else queue.push({name:f.name,get:t=>t==='blob'?Promise.resolve(f):t==='arraybuffer'?f.arrayBuffer():f.text()});
  }
  nImg=queue.filter(q=>IMG.test(q.name)).length;
  const skipped=[];
  for(const q of queue){
    if(IMG.test(q.name)){done++;
      try{parts.push(await ocr(await q.get('blob'),`Картинка ${done} из ${nImg}`))}
      catch(err){skipped.push(q.name+' (не удалось открыть картинку)')}}
    else if(TXT.test(q.name)) parts.push(await q.get('string').catch(()=>q.get('text')));
    else if(XLS.test(q.name)) parts.push(await readXlsx(await q.get('arraybuffer')));
    else skipped.push(q.name);
  }
  return {text:parts.filter(Boolean).join('\n\n'),skipped,nImg};
}

  $('loadFiles').onchange=async e=>{
    const files=[...e.target.files]; e.target.value=''; if(!files.length||loadBusy) return;
    loadBusy=true; setLoadButtons(true);
    try{
      const {text,skipped,nImg}=await readFiles(files);
      if(!text.trim()){loadStatus('В файлах не нашлось текста.'+(skipped.length?' Пропущены: '+skipped.join(', '):''),true);return}
      const t=$('loadText'); t.value=(t.value.trim()?t.value.trim()+'\n\n':'')+text;
      loadStatus(nImg?'Текст распознан. Проверьте его в поле выше: ошибки распознавания можно исправить и нажать «Разобрать» ещё раз.':'');
      await startParse(t.value,true);
      if(skipped.length) loadStatus('Пропущены файлы: '+skipped.join(', '));
    }catch(err){loadStatus('Не удалось прочитать файлы: '+((err&&err.message)||err),true)}
    finally{loadBusy=false;setLoadButtons(false)}
  };
}
function setLoadButtons(dis){['loadParse','loadAdd'].forEach(id=>{const b=$(id);if(b)b.disabled=dis})}
async function startParse(text,keepStatus){
  if(!/[A-Za-z]/.test(text)){loadStatus('Не нашёл английских слов.',true);return}
  await getCommon();
  const have=new Map(words.map(w=>[w.k,w]));
  const parsed=parseInput(text); loadDropped=parsed.dropped||[];
  loadItems=parsed.map(it=>{
    const dup=have.has(it.k);
    let ru=it.ru, src=it.ru.length?'given':'';
    if(!ru.length&&PHRASES[it.en]){ru=PHRASES[it.en].slice();src='dict'}
    if(!ru.length&&BASE_DICT[it.en]){ru=BASE_DICT[it.en].slice();src='dict'}
    const ex=EXAMPLES[it.en]?{...EXAMPLES[it.en]}:it.ex?{en:it.ex.slice(0,140),ru:''}:null;
    return {...it,ru,src,dup,ex,on:!dup&&it.how!=='name',state:ru.length?'':'wait'};
  });
  if(!keepStatus) loadStatus('');
  renderPreview();
  const need=loadItems.filter(i=>i.state==='wait'&&!i.dup);
  loadItems.filter(i=>i.state==='wait'&&i.dup).forEach(i=>i.state='');
  if(need.length){
    loadStatus(`Перевожу новые слова: 0 из ${need.length}…`); let n=0;
    await pool(need,4,async it=>{
      const t=await translateWord(it.en);
      if(t){it.ru=t;it.src='auto';it.state=''}else it.state='none';
      if(it.ex&&!it.ex.ru) it.ex.ru=await translateSentence(it.ex.en);
      n++; loadStatus(`Перевожу новые слова: ${n} из ${need.length}…`); updateRow(it);
    });
    const miss=need.filter(i=>i.state==='none').length;
    loadStatus(miss?`Для ${miss} слов перевод не найден: впишите его сами или снимите галочку.`:'Переводы готовы. Проверьте их и нажмите «Добавить».',!!miss);
  }
  renderCount();
}
const TAGS={given:'перевод задан',fixed:'смысл задан',dict:'',auto:'автоперевод'};
function rowHTML(it,i){
  return `<div class="pv" id="pv-${i}">
    <input type="checkbox" id="pv-c-${i}" ${it.on?'checked':''} aria-label="Добавить ${esc(it.en)}">
    <div class="pv-en"><input type="text" id="pv-e-${i}" value="${esc(it.en)}" lang="en" aria-label="Английское слово">
      <span class="pv-tags">${it.en.includes(' ')?'<span class="tag phrase">выражение</span>':''}${it.dup?'<span class="tag dup">уже в словаре</span>':''}${it.how==='name'?'<span class="tag dup">похоже на имя</span>':''}${TAGS[it.src]?`<span class="tag">${TAGS[it.src]}</span>`:''}</span></div>
    <div class="pv-ru"><input type="text" id="pv-t-${i}" value="${esc(it.ru.join('; '))}" placeholder="${it.state==='wait'?'перевожу…':'впишите перевод'}" aria-label="Перевод">
      ${it.ex?`<span class="pv-ex" lang="en">${esc(it.ex.en)}${it.ex.ru?' — '+esc(it.ex.ru):''}</span>`:''}</div>
  </div>`;
}
function renderPreview(){
  const box=$('loadPreview'); box.hidden=!loadItems.length;
  if(!loadItems.length){box.innerHTML='';return}
  box.innerHTML=`<div class="toolbar"><h2 id="pvTitle"></h2><span class="row"><button class="linkish" id="pvAll" type="button">Выбрать все новые</button><button class="linkish" id="pvNone" type="button">Снять все</button></span></div>
    <div class="preview">${loadItems.map(rowHTML).join('')}</div>
    <p class="hint">Перевод и само слово можно поправить. Значения разделяйте точкой с запятой.</p>
    ${loadDropped.length?`<details class="dropped"><summary>Пропущено ${loadDropped.length}: имена, сокращения, редкие слова и ошибки распознавания</summary><p>${loadDropped.slice(0,300).map(esc).join(', ')}</p><p class="hint">Если среди них есть нужное слово, впишите его в поле выше списком через запятую — списки не фильтруются.</p></details>`:''}
    <div class="row"><button class="btn" id="loadAdd" type="button">Добавить</button><button class="btn plain" id="loadCancel" type="button">Отмена</button></div>`;
  loadItems.forEach((it,i)=>bindRow(it,i));
  $('pvAll').onclick=()=>{loadItems.forEach((it,i)=>{it.on=!it.dup;$('pv-c-'+i).checked=it.on});renderCount()};
  $('pvNone').onclick=()=>{loadItems.forEach((it,i)=>{it.on=false;$('pv-c-'+i).checked=false});renderCount()};
  $('loadAdd').onclick=commitLoad;
  $('loadCancel').onclick=()=>{loadItems=[];renderPreview();loadStatus('')};
  renderCount();
}
function bindRow(it,i){
  $('pv-c-'+i).onchange=e=>{it.on=e.target.checked;renderCount()};
  $('pv-e-'+i).oninput=e=>{it.en=e.target.value.trim().toLowerCase()};
  $('pv-t-'+i).oninput=e=>{it.ru=e.target.value.split(';').map(x=>x.trim()).filter(Boolean);it.state=''};
}
function updateRow(it){
  const i=loadItems.indexOf(it), el=$('pv-'+i); if(!el) return;
  const typed=$('pv-t-'+i)&&$('pv-t-'+i).value; if(typed&&it.src==='auto') return;   // user already typed a translation
  el.outerHTML=rowHTML(it,i); bindRow(it,i);
}
function renderCount(){
  const t=$('pvTitle'); if(!t) return;
  const sel=loadItems.filter(i=>i.on).length, fresh=loadItems.filter(i=>!i.dup).length;
  t.textContent=`Найдено ${loadItems.length}, новых ${fresh}`;
  const b=$('loadAdd'); if(b){b.textContent=`Добавить в словарь (${sel})`;b.disabled=!sel||loadBusy}
}
async function commitLoad(){
  const sel=loadItems.filter(i=>i.on&&i.en);
  const noTr=sel.filter(i=>!i.ru.length);
  if(noTr.length){loadStatus(`У ${noTr.length} выбранных слов нет перевода (${noTr.slice(0,5).map(i=>i.en).join(', ')}${noTr.length>5?'…':''}). Впишите перевод или снимите галочку.`,true);return}
  const have=new Map(words.map(w=>[w.k,w])), upd={}; let added=0, changed=0;
  for(const it of sel){
    const k=wordKey(it.en), old=have.get(k);
    if(old){ if(it.how==='given'||it.how==='fixed'||it.src!=='dict'){const {k:_,...d}=old;upd[k]={...d,ru:it.ru};changed++} }
    else{ upd[k]={en:it.en,ru:it.ru,r:0,seen:0,ok:0,last:0,...(it.ex&&it.ex.en&&!EXAMPLES[it.en]?{ex:{en:it.ex.en,ru:it.ex.ru||''}}:{})}; added++; }
  }
  if(!Object.keys(upd).length){loadStatus('Нечего добавлять: все выбранные слова уже есть в словаре.');return}
  $('loadAdd').disabled=true; loadStatus('Сохраняю…');
  try{
    await B.addWords(me,upd);
    loadItems=[]; renderPreview(); $('loadText').value='';
    loadStatus(`Готово: добавлено ${added}${changed?`, обновлено ${changed}`:''}. Новые слова уже участвуют в тренировке.`);
  }catch(err){loadStatus('Не удалось сохранить: '+((err&&(err.code||err.message))||err),true);$('loadAdd').disabled=false}
}

/* ---------- Picking the next word ---------- */
let recent=[];
function pick(){
  const pool=active(); let cand=pool.filter(w=>!recent.includes(w.k)); if(!cand.length) cand=pool;
  const wt=w=>Math.pow(2,(LEARNED-w.r)/1.5);    // -5 -> ~40x, 0 -> 4x, +3 -> 1x, +5 -> 0.4x
  let x=Math.random()*cand.reduce((s,w)=>s+wt(w),0);
  for(const w of cand){x-=wt(w);if(x<=0)return w}
  return cand[cand.length-1];
}

/* ---------- Answer checking ---------- */
function norm(s){return s.toLowerCase().replace(/ё/g,'е').replace(/\([^)]*\)/g,' ').replace(/[^a-zа-я0-9\s-]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
const ENDS=/(ться|тся|ешь|ете|ишь|ите|ого|его|ому|ему|ыми|ими|ть|ти|ет|ем|ит|им|ут|ют|ат|ят|ый|ий|ой|ая|яя|ое|ее|ые|ие|ую|юю|ю|у|а|я|ы|и|о|е|ь)$/;
const stem=s=>s.length>3?s.replace(ENDS,''):s;
function close(a,b){
  if(a===b) return true;
  if(Math.min(a.length,b.length)<4) return false;
  if(lev(a,b)<=1) return true;
  const sa=stem(a),sb=stem(b); if(sa.length>=2&&sa===sb) return true;
  let p=0;while(p<a.length&&p<b.length&&a[p]===b[p])p++;
  return p>=Math.max(4,Math.min(a.length,b.length)-2)&&Math.abs(a.length-b.length)<=3;
}
/* Short words (о, и, в, на…) are often heard by speech recognition as a stretched sound, a letter name
   or a Latin look-alike: bring those back to the plain word. */
const LAT={o:'о',a:'а',y:'у',k:'к',c:'с',e:'е',u:'у',i:'и',b:'в',v:'в',s:'с'};
const SHORT={оу:'о',ох:'о',оо:'о',ой:'о',ии:'и',иии:'и',ве:'в',вэ:'в',фэ:'в',ф:'в',ка:'к',кэ:'к',эс:'с',ээ:'е',аа:'а',уу:'у',наа:'на'};
function fixShort(t){
  if(t.length>4) return t;
  if(t.length===1&&LAT[t]) t=LAT[t];
  t=t.replace(/(.)\1+/g,'$1');                 // ооо -> о, ии -> и
  return SHORT[t]||t;
}
function isCorrect(answers,w){
  const accepted=w.ru.flatMap(m=>m.split(',')).map(norm).filter(Boolean);
  return answers.some(ans=>{
    const parts=ans.toLowerCase().split(/[,;/]| или /).map(p=>norm(p.replace(/[a-z]/g,c=>LAT[c]||c))).filter(Boolean);
    const tokens=parts.flatMap(p=>[p,...p.split(' ')]).map(fixShort).filter(Boolean);   // spoken answers come as phrases
    return tokens.some(p=>accepted.some(a=>close(p,a)||(a.includes(' ')&&a.split(' ').some(t=>t.length>3&&close(p,t)))));
  });
}

/* ---------- Speech ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang))}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;
  const v=voices.find(v=>/en[-_]US/i.test(v.lang))||voices[0];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function stopRec(){clearTimeout(listenTimer);if(rec){const r=rec;rec=null;r.cancelled=true;try{r.abort()}catch(e){}}}

/* ---------- The cycle ---------- */
let cur=null, phase='start', speakTimer=null, shownAt=0, firstAt=0;
const card=$('view-train');
const MIC=`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
const metaHTML=w=>`${meter(w.r)}<span>${w.seen?'показано '+w.seen+' раз':'новое слово'}</span>`;

function renderStart(){
  if(!words.length){
    phase='empty';
    card.innerHTML=`<h2>Словарь пока пуст</h2><p class="intro">В этом аккаунте ещё нет слов. Тренировка начнётся, как только они будут добавлены.</p>`;
    return;
  }
  if(!active().length){
    phase='empty';
    card.innerHTML=`<h2>Все слова выучены</h2><p class="intro">Все ${words.length} слов набрали больше +5 и перенесены в архив. Их можно вернуть в тренировку на вкладке «Усваиваемость».</p>`;
    return;
  }
  phase='start';
  const arch=archived().length;
  card.innerHTML=`<div class="meta">${active().length} слов в тренировке${arch?' · '+arch+' в архиве':''}</div>
    <p class="intro">Программа покажет и произнесёт английское слово. Скажите перевод по-русски в микрофон или напишите его в поле и нажмите Enter. Чем быстрее верный ответ, тем больше растёт рейтинг слова.</p>
    <button class="btn big" id="startBtn" type="button">Начать</button>`;
  $('startBtn').onclick=()=>{sessStart=Date.now();nextWord()}; $('startBtn').focus();
}
function nextWord(){
  stopRec(); hush(); clearTimeout(speakTimer);
  if(!active().length){renderStart();return}
  cur=pick(); recent.push(cur.k); while(recent.length>Math.min(4,active().length-1)) recent.shift();
  phase='ask'; firstAt=0;
  card.innerHTML=`<div class="meta" id="meta">${metaHTML(cur)}</div>
    <button class="word" id="word" type="button" lang="en" title="Нажмите, чтобы услышать ещё раз">${esc(cur.en)}</button>
    <form class="field" id="form"><input id="ans" lang="ru" autocomplete="off" placeholder="Перевод по-русски" aria-label="Ваш ответ"><button class="btn" type="submit">Ввод</button></form>
    <div class="actions">
      <button class="mic" id="micBtn" type="button"><span class="ring">${MIC}</span><span id="micLbl">Сказать</span></button>
      <button class="btn plain" id="idkBtn" type="button">Не знаю</button>
    </div>
    <p class="status" id="status"></p>`;
  $('word').onclick=()=>speak(cur.en);
  $('micBtn').onclick=toggleMic;
  $('idkBtn').onclick=()=>{if(phase==='ask')process([],'',true)};
  $('ans').oninput=()=>{if(!firstAt)firstAt=Date.now();if(rec){stopRec();setStatus('')}};
  $('form').onsubmit=e=>{e.preventDefault();const v=$('ans').value.trim();
    if(!v){setStatus('Введите перевод, нажмите микрофон или «Не знаю»');$('ans').focus();return}process([v],v)};
  if(matchMedia('(pointer:fine)').matches) $('ans').focus();   // on phones don't pop the keyboard over the word
  shownAt=Date.now();
  speakTimer=setTimeout(()=>{if(phase==='ask'&&!rec)speak(cur.en)},SPEAK_DELAY);
}
function setStatus(t,err){const s=$('status');if(s){s.textContent=t;s.classList.toggle('err',!!err)}}
let listenTimer=null;
function toggleMic(){
  if(phase!=='ask') return;
  if(rec){stopRec();resetMic();setStatus('');return}
  if(!Rec){setStatus('Этот браузер не распознаёт речь. Откройте страницу в Chrome, Edge или Safari, либо напишите ответ.',true);return}
  hush(); clearTimeout(speakTimer);
  const inp=$('ans'), btn=$('micBtn'); inp.value='';
  const r=new Rec(); rec=r;
  // continuous mode keeps listening through a short pause, so a single short word is not cut off
  r.lang='ru-RU'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  const live=()=>rec===r&&!r.cancelled&&phase==='ask'&&$('micBtn')===btn;
  let alts=null, heard='';
  btn.classList.add('listening'); $('micLbl').textContent='Подождите'; inp.placeholder='Включаю микрофон…';
  r.onaudiostart=()=>{if(!live())return;$('micLbl').textContent='Слушаю';inp.placeholder='Слушаю…';
    setStatus('Говорите. Короткое слово лучше сказать фразой: «предлог в», «союз и».')};
  r.onspeechstart=()=>{if(live()&&!firstAt)firstAt=Date.now()};
  let quiet=null;
  r.onresult=e=>{
    if(!live())return; if(!firstAt)firstAt=Date.now();
    // if the browser keeps waiting after the learner has stopped talking, finish after 0.8 s of no new words
    clearTimeout(quiet); quiet=setTimeout(()=>{if(live()){try{r.stop()}catch(err){}}},800);
    let txt='';for(let i=e.resultIndex;i<e.results.length;i++)txt+=e.results[i][0].transcript;
    heard=(heard+' '+txt).trim(); inp.value=txt.trim()||heard;
    const res=e.results[e.results.length-1];
    if(res.isFinal){
      alts=Array.from(res).map(a=>a.transcript.trim()).filter(Boolean);
      if(alts.length){clearTimeout(quiet);const a2=alts.slice();stopRec();resetMic();process(a2,a2[0])}   // answer as soon as a phrase is final
    }
  };
  r.onerror=e=>{if(!live())return;
    const m={'not-allowed':'Нет доступа к микрофону. Разрешите его в настройках браузера или напишите ответ.',
      'service-not-allowed':'Распознавание речи недоступно. Разрешите микрофон или напишите ответ.',
      'no-speech':'Ничего не услышал. Нажмите микрофон и скажите ещё раз. Короткое слово скажите фразой, например «предлог о», или напишите его.',
      'audio-capture':'Микрофон не найден.','network':'Нет связи с сервисом распознавания речи.'}[e.error];
    if(m) setStatus(m,true)};
  r.onend=()=>{
    const wasLive=live(); if(rec===r) rec=null; clearTimeout(listenTimer); resetMic();
    if(!wasLive) return;
    const v=inp.value.trim(); if(v) process([v],v);
  };
  clearTimeout(listenTimer);
  listenTimer=setTimeout(()=>{if(rec===r){try{r.stop()}catch(e){}}},8000);   // never keep the microphone open longer than 8 s
  try{r.start()}catch(e){rec=null;resetMic();setStatus('Не удалось включить микрофон.',true)}
}
function resetMic(){
  clearTimeout(listenTimer);
  const b=$('micBtn'); if(b){b.classList.remove('listening');$('micLbl').textContent='Сказать'}
  const i=$('ans'); if(i) i.placeholder='Перевод по-русски';
}
function process(answers,shown,idk){
  if(phase!=='ask') return; phase='result'; stopRec(); hush(); clearTimeout(speakTimer);
  const ok=!idk&&isCorrect(answers,cur);
  const sec=Math.max(0,((firstAt||Date.now())-shownAt)/1000);
  let note='';
  if(practice){ note='Режим без статистики: рейтинг не изменён'; }
  else{
    const before=cur.r;
    if(ok){
      const nr=cur.r+speedFactor(sec);
      if(nr>RMAX+1e-9){cur.a=Date.now();cur.r=RMAX}else cur.r=round2(clamp(nr,RMIN,RMAX));
      cur.ok++;
      cur.t=round2(cur.t?cur.t*.7+sec*.3:sec);
    } else cur.r=round2(clamp(cur.r-PENALTY,RMIN,RMAX));
    cur.seen++; cur.last=Date.now();
    const d=round2(cur.r-before);
    note=cur.a?`Рейтинг больше +5: слово выучено и перенесено в архив · ответ через ${fmtSec(sec)}`
      :`Рейтинг ${d>=0?'+':'−'}${Math.abs(d).toFixed(1).replace('.',',')} → ${fmtR(cur.r)}`+(ok?` · ответ через ${fmtSec(sec)}`:'');
    const {k,...data}=cur;
    B.save(me,k,data).catch(()=>{const s=$('saveErr');if(s)s.hidden=false});
    logAnswer(ok);
    progress();
  }
  $('meta').innerHTML=practice?metaHTML(cur):`${meter(cur.r)}<span>показано ${cur.seen} раз</span>`;
  $('form').remove(); document.querySelector('.actions').remove(); $('status').remove();
  const exm=!ok&&(cur.ex&&cur.ex.en?cur.ex:EXAMPLES[cur.en]);
  card.insertAdjacentHTML('beforeend',`<div class="verdict ${ok?'ok':'bad'}"><b>${ok?'Правильно':idk?'Запомните':'Неправильно'}</b>
      <div class="meanings">${cur.ru.map(esc).join('; ')}</div>${idk?'':`<span class="your">Ваш ответ: ${esc(shown)}</span>`}
      ${exm?`<button class="example" id="exBtn" type="button" title="Послушать ещё раз"><span class="ex-en" lang="en">${esc(exm.en)}</span><span class="ex-ru">${esc(exm.ru)}</span></button>`:''}
      <span class="delta">${note}</span></div>
    <button class="btn big" id="nextBtn" type="button">Далее</button>
    <p class="status err" id="saveErr" hidden>Результат не сохранился: нет связи с сервером.</p>`);
  const nb=$('nextBtn'); nb.onclick=nextWord; nb.focus();
  if(exm){$('exBtn').onclick=()=>speak(exm.en);speakTimer=setTimeout(()=>{if(phase==='result')speak(exm.en)},400)}
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&phase==='result'&&view==='train'&&e.target.tagName!=='BUTTON'){e.preventDefault();nextWord()}
});
</script>
</body>
</html>
