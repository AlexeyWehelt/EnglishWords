<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренажёр английских слов</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one column. Progress lamp on top, then a single card that runs the word cycle. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d3dae1;
  --accent:#1d5a9e; --accent-soft:#e1ebf7;
  --ok:#23824a; --ok-soft:#e2f3e8; --bad:#c23b33; --bad-soft:#fbe7e5; --warn:#b97716;
  --lamp-off:#c3cbd3;
  --f-word:"Literata",Georgia,serif;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --ink:#e5eaf0; --muted:#94a2b1; --line:#2b3540;
  --accent:#71a8e6; --accent-soft:#1c2c40; --ok:#58c07f; --ok-soft:#173023; --bad:#e8675e; --bad-soft:#3a1c1a; --warn:#e0a54c;
  --lamp-off:#3a4552; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --ink:#e5eaf0; --muted:#94a2b1; --line:#2b3540;
  --accent:#71a8e6; --accent-soft:#1c2c40; --ok:#58c07f; --ok-soft:#173023; --bad:#e8675e; --bad-soft:#3a1c1a; --warn:#e0a54c;
  --lamp-off:#3a4552; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-word);font-weight:700;font-size:1.35rem;margin:0}
.lamp{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px}
.bulb{width:22px;height:22px;border-radius:50%;background:var(--lamp-off);flex:none;box-shadow:inset 0 -3px 5px rgba(0,0,0,.18)}
.lamp[data-state="amber"] .bulb{background:var(--warn)}
.lamp[data-state="green"] .bulb{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft),0 0 16px var(--ok)}
.lamp-txt{display:flex;flex-direction:column;line-height:1.15}
.lamp-txt b{font-size:.85rem;font-weight:600}
.lamp-txt span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 18px 24px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;min-height:380px;justify-content:center}
.meta{display:flex;gap:10px;align-items:center;font-size:.75rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.word{font-family:var(--f-word);font-weight:700;font-size:clamp(2.2rem,10vw,3.4rem);line-height:1.1;overflow-wrap:anywhere;margin:0;border:0;background:none;color:var(--ink);cursor:pointer;padding:0 4px}
.word:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.field{width:100%;max-width:400px;display:flex;gap:8px}
.field input{flex:1;min-width:0;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:center}
.field input:focus{outline:2px solid var(--accent);border-color:transparent}
.field input[readonly]{cursor:default}
.modes{display:flex;gap:28px;justify-content:center}
.mode{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font:500 .85rem var(--f-ui);cursor:pointer;padding:0}
.mode .ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent);background:var(--surface);position:relative}
.mode:hover .ring{background:var(--accent-soft)}
.mode:focus-visible .ring{outline:3px solid var(--accent);outline-offset:3px}
.mode[aria-pressed="true"] .ring{background:var(--accent);color:var(--surface)}
.mode.listening .ring{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.mode.listening .ring::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--bad);opacity:.6}
@media (prefers-reduced-motion:no-preference){
  .mode.listening .ring::after{animation:pulse 1.2s ease-out infinite}
  @keyframes pulse{from{transform:scale(.9);opacity:.7}to{transform:scale(1.25);opacity:0}}
  .verdict{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:10px;padding:12px 22px;font:600 1rem var(--f-ui);cursor:pointer;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.big{padding:14px 40px;font-size:1.1rem}
.status{min-height:1.4em;font-size:.88rem;color:var(--muted);margin:0;max-width:40ch}
.status.err{color:var(--bad)}
.verdict{width:100%;max-width:400px;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.verdict b{font-size:1.15rem}
.verdict.ok b{color:var(--ok)} .verdict.bad b{color:var(--bad)}
.meanings{font-size:1.1rem;font-weight:500}
.your{font-size:.85rem;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.intro{color:var(--muted);max-width:36ch;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Тренажёр английских слов</h1>
    <div class="lamp" id="lamp" data-state="off" title="Индикатор успеваемости">
      <div class="bulb"></div>
      <div class="lamp-txt"><b id="lampTitle">Успеваемость</b><span id="lampSub">—</span></div>
    </div>
  </header>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
const BASE = `about|о, об; около, примерно; вокруг
after|после; за, вслед за; спустя
already|уже
also|также, тоже
always|всегда
and|и; а
any|любой; какой-нибудь; сколько-нибудь
at|в, на, у (о месте); в (о времени)
because|потому что; так как
before|до, перед; раньше, прежде
but|но; а; кроме
each|каждый
then|тогда; потом, затем
else|ещё; иначе; другой
for|для; за; в течение; на
in|в; через (о времени)
just|только что; просто; как раз; справедливый
like|нравиться; любить; как, подобно; похожий
near|около, рядом; близкий
never|никогда
of|из; о, об; (родительный падеж)
often|часто
on|на; в (о днях); включено
only|только; единственный
or|или; иначе
out|вне, снаружи; из; наружу
some|некоторый; несколько; немного; какой-то
soon|скоро
today|сегодня
to|к; в, на (направление); до; чтобы
usually|обычно
here|здесь, тут; сюда
how|как
that|тот; что; который; это
there|там; туда
these|эти
this|этот, это
those|те
what|что; какой
when|когда
where|где; куда
who|кто; который
why|почему; зачем
answer|ответ; отвечать
ask|спрашивать; просить
bore|надоедать, наскучить; зануда; скука
check|проверять; проверка; чек
come|приходить, приезжать; идти
complete|завершать, заканчивать; полный, законченный
do|делать
download|скачивать, загружать; загрузка
draw|рисовать; тянуть; ничья
drink|пить; напиток
eat|есть, кушать
get|получать; становиться; добираться; доставать
give|давать; дарить
go|идти, ходить; ехать
have|иметь; есть (у меня есть)
know|знать
listen|слушать
live|жить; живой
look|смотреть; выглядеть; взгляд
love|любить; любовь
make|делать; создавать; заставлять
move|двигать, двигаться; переезжать; движение
need|нуждаться; нужно; потребность
put|класть, положить; ставить
run|бегать, бежать; управлять
say|говорить, сказать
see|видеть; понимать
send|отправлять, посылать
set|устанавливать; ставить; набор, комплект
sing|петь
sleep|спать; сон
speak|говорить, разговаривать
study|учиться, изучать; учёба
swim|плавать
take|брать, взять; занимать (о времени)
talk|разговаривать, говорить; беседа
tell|рассказывать; говорить, сказать
think|думать; считать
use|использовать; польза
want|хотеть
watch|смотреть; наблюдать; часы
arrow|стрела; стрелка
bad|плохой
child|ребёнок
children|дети
date|дата; свидание; финик
family|семья
fast|быстрый; быстро; пост
favorite|любимый
good|хороший; добро
great|великий; отличный; огромный
home|дом; домой; домашний
later|позже, потом
lesson|урок
letter|письмо; буква
life|жизнь
man|мужчина; человек
page|страница
paper|бумага; газета; документ
parents|родители
poor|бедный
ready|готовый
room|комната; место
science|наука
screen|экран
sentence|предложение; приговор
slow|медленный
sometimes|иногда
song|песня
time|время; раз
word|слово
work|работа; работать
print|печатать; печать
woman|женщина`;
const LEARNED = 4, MAXR = 5;          // rating 0..5; a word counts as learned from 4
const SPEAK_DELAY = 500;              // ms between showing the word and saying it

/* ---------- Words and progress ---------- */
const splitMeanings=v=>v.split(';').map(s=>s.trim()).filter(Boolean);
const newWord=(en,ru)=>({en,ru,r:0,seen:0,ok:0,last:0});
const baseWords=()=>BASE.split('\n').map(l=>l.split('|')).filter(p=>p[0]&&p[1]).map(([en,ru])=>newWord(en.trim().toLowerCase(),splitMeanings(ru)));
const LS='en_trainer_v1';
let S;
try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!S||!Array.isArray(S.words)||!S.words.length) S={words:baseWords(),updated:Date.now()};
let cloud=null, cloudTimer=null;
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(cloud){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloud.set(JSON.parse(JSON.stringify(S))).catch(()=>{cloud=null}),1200)}
}
/* On claude.ai each viewer keeps a private copy in their account; elsewhere localStorage only. */
(async()=>{try{
  if(!window.claude||!claude.use) return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]); if(!db||!user) return;
  const id=await user.id(); if(!id) return;
  const ref=db.doc('data/users/'+id+'/vocab'); const snap=await ref.get(); const remote=snap.exists?snap.data():null;
  if(remote&&Array.isArray(remote.words)&&remote.words.length&&(remote.updated||0)>(S.updated||0)){S=remote;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}progress()}
  cloud=ref; if(!remote||(remote.updated||0)<(S.updated||0)) await ref.set(JSON.parse(JSON.stringify(S)));
}catch(e){cloud=null}})();
/* Optional smart check through Claude, only available inside claude.ai */
const samplePromise=(async()=>{try{return window.claude&&claude.use?await claude.use('sample'):null}catch(e){return null}})();
let sampleOff=false;
async function askClaude(prompt){
  if(sampleOff) return null; const s=await samplePromise; if(!s) return null;
  try{return await s.json(prompt,{modelTier:'quick'})}catch(e){if(e&&e.code==='not_granted')sampleOff=true;return null}
}

function progress(){
  const n=S.words.length, learned=S.words.filter(w=>w.r>=LEARNED).length, pct=n?Math.round(learned/n*100):0;
  document.getElementById('lamp').dataset.state=!n?'off':learned===n?'green':learned>0?'amber':'off';
  document.getElementById('lampTitle').textContent=n&&learned===n?'Все слова выучены':'Успеваемость '+pct+'%';
  document.getElementById('lampSub').textContent=`${learned} из ${n} слов усвоено`;
  document.getElementById('barFill').style.width=pct+'%';
}
const dots=r=>`<span class="dots" title="Рейтинг ${r} из ${MAXR}">${Array.from({length:MAXR},(_,i)=>`<i class="${i<r?'on':''}"></i>`).join('')}</span>`;

let recent=[];
function pick(){
  const pool=S.words; let cand=pool.filter(w=>!recent.includes(w.en)); if(!cand.length) cand=pool;
  const wt=w=>Math.pow(MAXR+1-w.r,2);                    // low rating -> shown much more often
  let x=Math.random()*cand.reduce((s,w)=>s+wt(w),0);
  for(const w of cand){x-=wt(w);if(x<=0)return w}
  return cand[cand.length-1];
}

/* ---------- Answer checking ---------- */
function norm(s){return s.toLowerCase().replace(/ё/g,'е').replace(/\([^)]*\)/g,' ').replace(/[^a-zа-я0-9\s-]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
const ENDS=/(ться|тся|ешь|ете|ишь|ите|ого|его|ому|ему|ыми|ими|ть|ти|ет|ем|ит|им|ут|ют|ат|ят|ый|ий|ой|ая|яя|ое|ее|ые|ие|ую|юю|ю|у|а|я|ы|и|о|е|ь)$/;
const stem=s=>s.length>3?s.replace(ENDS,''):s;
function close(a,b){
  if(a===b) return true;
  if(Math.min(a.length,b.length)<4) return false;
  if(lev(a,b)<=1) return true;
  const sa=stem(a),sb=stem(b); if(sa.length>=2&&sa===sb) return true;
  let p=0;while(p<a.length&&p<b.length&&a[p]===b[p])p++;
  return p>=Math.max(4,Math.min(a.length,b.length)-2)&&Math.abs(a.length-b.length)<=3;
}
function localCheck(ans,w){
  const accepted=w.ru.flatMap(m=>m.split(',')).map(norm).filter(Boolean);
  const parts=ans.split(/[,;/]| или /).map(norm).filter(Boolean);
  // a spoken answer may come as several words: also try each word on its own
  const tokens=parts.flatMap(p=>[p,...p.split(' ')]).filter(t=>t.length>1);
  return tokens.some(p=>accepted.some(a=>close(p,a)||(a.includes(' ')&&a.split(' ').some(t=>t.length>3&&close(p,t)))));
}
async function isCorrect(answers,w){
  if(answers.some(a=>localCheck(a,w))) return true;
  const r=await askClaude(`Учащийся переводит английское слово "${w.en}" на русский. Основные значения: ${w.ru.join('; ')}.
Ответ учащегося${answers.length>1?' (варианты распознавания речи)':''}: ${answers.map(a=>'"'+a+'"').join(', ')}.
Засчитай ответ, если это верный перевод хотя бы одного значения: допустимы синонимы, другая форма слова и мелкие опечатки. Неверный смысл не засчитывай.
Ответь только JSON: {"ok": true} или {"ok": false}`);
  return !!(r&&r.ok===true);
}

/* ---------- Speech ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang))}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;
  const v=voices.find(v=>/en[-_]US/i.test(v.lang))||voices[0];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;

/* ---------- The cycle ---------- */
let cur=null, phase='start', mode=null, speakTimer=null;
const card=document.getElementById('card');
const MIC=`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
const PEN=`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M14.5 5.5l3 3"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderStart(){
  phase='start';
  card.innerHTML=`<div class="meta">${S.words.length} слов в словаре</div>
    <p class="intro">Программа покажет и произнесёт английское слово. Ответьте по-русски голосом или письменно.</p>
    <button class="btn big" id="startBtn" type="button">Начать</button>`;
  document.getElementById('startBtn').onclick=nextWord;
}
function nextWord(){
  stopRec(); hush(); clearTimeout(speakTimer);
  cur=pick(); recent.push(cur.en); while(recent.length>Math.min(4,S.words.length-1)) recent.shift();
  phase='ask'; mode=null;
  card.innerHTML=`<div class="meta" id="meta">${dots(cur.r)}<span>${cur.seen?'показано '+cur.seen+' раз':'новое слово'}</span></div>
    <button class="word" id="word" type="button" lang="en" title="Нажмите, чтобы услышать ещё раз">${esc(cur.en)}</button>
    <form class="field" id="form"><input id="ans" lang="ru" autocomplete="off" readonly placeholder="Ваш ответ" aria-label="Ваш ответ"><button class="btn" id="enterBtn" type="submit" hidden>Ввод</button></form>
    <div class="modes">
      <button class="mode" id="micBtn" type="button"><span class="ring">${MIC}</span><span id="micLbl">Сказать</span></button>
      <button class="mode" id="penBtn" type="button" aria-pressed="false"><span class="ring">${PEN}</span>Написать</button>
    </div>
    <p class="status" id="status"></p>`;
  document.getElementById('word').onclick=()=>speak(cur.en);
  document.getElementById('micBtn').onclick=toggleMic;
  document.getElementById('penBtn').onclick=usePen;
  document.getElementById('form').onsubmit=e=>{e.preventDefault();const v=document.getElementById('ans').value.trim();
    if(!v){setStatus('Введите перевод');document.getElementById('ans').focus();return}process([v],v)};
  speakTimer=setTimeout(()=>{if(phase==='ask')speak(cur.en)},SPEAK_DELAY);
}
function setStatus(t,err){const s=document.getElementById('status');if(s){s.textContent=t;s.classList.toggle('err',!!err)}}
function usePen(){
  if(phase!=='ask') return; stopRec(); mode='pen';
  const inp=document.getElementById('ans'); inp.readOnly=false; inp.placeholder='Перевод по-русски'; inp.focus();
  document.getElementById('enterBtn').hidden=false; document.getElementById('penBtn').setAttribute('aria-pressed','true');
  setStatus('Напишите перевод и нажмите «Ввод»');
}
function toggleMic(){
  if(phase!=='ask') return;
  if(rec){stopRec();setStatus('');return}
  if(!Rec){setStatus('Этот браузер не распознаёт речь. Откройте страницу в Chrome, Edge или Safari, либо ответьте письменно.',true);return}
  hush(); clearTimeout(speakTimer);
  mode='mic';
  const inp=document.getElementById('ans'); inp.readOnly=true; inp.value=''; inp.placeholder='Слушаю…';
  document.getElementById('enterBtn').hidden=true; document.getElementById('penBtn').setAttribute('aria-pressed','false');
  const btn=document.getElementById('micBtn');
  const r=new Rec(); rec=r;
  r.lang='ru-RU'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  let finalAlts=null;
  r.onstart=()=>{btn.classList.add('listening');document.getElementById('micLbl').textContent='Слушаю';setStatus('Говорите перевод')};
  r.onresult=e=>{
    const res=e.results[e.results.length-1];
    inp.value=res[0].transcript.trim();
    if(res.isFinal) finalAlts=Array.from(res).map(a=>a.transcript.trim()).filter(Boolean);
  };
  r.onerror=e=>{
    const msg={'not-allowed':'Нет доступа к микрофону. Разрешите его в настройках браузера или ответьте письменно.',
      'service-not-allowed':'Нет доступа к распознаванию речи. Разрешите микрофон или ответьте письменно.',
      'no-speech':'Ничего не услышал. Нажмите микрофон и скажите ещё раз.',
      'audio-capture':'Микрофон не найден.','network':'Нет связи с сервисом распознавания речи.'}[e.error];
    if(msg) setStatus(msg,true);
  };
  r.onend=()=>{
    if(rec===r) rec=null;
    const b=document.getElementById('micBtn'); if(b){b.classList.remove('listening');document.getElementById('micLbl').textContent='Сказать'}
    if(phase!=='ask') return;
    if(finalAlts&&finalAlts.length){process(finalAlts,finalAlts[0])}
    else if(inp.value.trim()){process([inp.value.trim()],inp.value.trim())}
    else inp.placeholder='Ваш ответ';
  };
  try{r.start()}catch(e){rec=null;setStatus('Не удалось включить микрофон.',true)}
}
function stopRec(){if(rec){const r=rec;rec=null;try{r.abort()}catch(e){}}}

async function process(answers,shown){
  if(phase!=='ask') return; phase='checking'; stopRec();
  const inp=document.getElementById('ans'); inp.value=shown; inp.readOnly=true;
  document.getElementById('enterBtn').hidden=true;
  setStatus('Проверяю…');
  const ok=await isCorrect(answers,cur);
  if(ok){cur.r=Math.min(MAXR,cur.r+1);cur.ok++}else cur.r=Math.max(0,cur.r-2);
  cur.seen++; cur.last=Date.now(); save(); progress();
  phase='result';
  document.getElementById('meta').innerHTML=`${dots(cur.r)}<span>показано ${cur.seen} раз</span>`;
  document.querySelector('.modes').remove(); document.getElementById('form').remove(); document.getElementById('status').remove();
  card.insertAdjacentHTML('beforeend',`<div class="verdict ${ok?'ok':'bad'}"><b>${ok?'Правильно':'Неправильно'}</b>
      <div class="meanings">${cur.ru.map(esc).join('; ')}</div><span class="your">Ваш ответ: ${esc(shown)}</span></div>
    <button class="btn big" id="nextBtn" type="button">Далее</button>`);
  const nb=document.getElementById('nextBtn'); nb.onclick=nextWord; nb.focus();
}

progress(); renderStart();
</script>
